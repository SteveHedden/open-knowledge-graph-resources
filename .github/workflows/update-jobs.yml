name: Update KG Jobs Data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Refresh one approved source; default refreshes all 17
        required: false
        default: all
        type: choice
        options:
          - all
          - himalayas
          - jobicy
          - jooble
          - arbeitnow
          - adzuna
          - first-party-neo4j
          - first-party-relationalai
          - first-party-tigergraph
          - first-party-wikimedia
          - first-party-stardog
          - first-party-weaviate
          - first-party-graphwise
          - first-party-enterprise-knowledge
          - first-party-metaphacts
          - first-party-topquadrant
          - first-party-eccenca
          - first-party-w3c
      dry_run:
        description: Dry run -- refresh and log, but skip publishing to data/jobs/ and committing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: repository-publication
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Record run start
        id: run_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            jobs/requirements.txt
            requirements.txt

      - name: Install KG Jobs dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install root catalog_snapshot.py dependencies
        run: pip install -r ../requirements.txt

      - name: Restore last committed snapshot into runtime/
        run: |
          mkdir -p runtime/raw runtime/sources
          [ -f ../data/jobs/jobs.json ] && cp ../data/jobs/jobs.json runtime/jobs.json
          [ -f ../data/jobs/jobs.ttl ] && cp ../data/jobs/jobs.ttl runtime/jobs.ttl
          [ -f ../data/jobs/run.json ] && cp ../data/jobs/run.json runtime/run.json
          if [ -d ../data/jobs/raw ]; then
            shopt -s nullglob
            for f in ../data/jobs/raw/*.json; do cp "$f" runtime/raw/; done
          fi
          exit 0

      - name: Refresh each production-cleared source
        id: refresh
        shell: bash
        run: |
          set +e
          requested="${{ github.event_name == 'workflow_dispatch' && inputs.source || 'all' }}"
          if [ "$requested" = "all" ]; then
            sources=(
              himalayas jobicy jooble arbeitnow adzuna
              first-party-neo4j first-party-relationalai first-party-tigergraph
              first-party-wikimedia first-party-stardog first-party-weaviate
              first-party-graphwise first-party-enterprise-knowledge
              first-party-metaphacts first-party-topquadrant first-party-eccenca
              first-party-w3c
            )
          else
            sources=("$requested")
          fi
          failures=0
          for source in "${sources[@]}"; do
            echo "::group::Refreshing $source"
            if [ "$source" = "jooble" ]; then
              JOOBLE_API_KEY="${{ secrets.JOOBLE_API_KEY }}" python scripts/live_pipeline.py --live --source jooble
            elif [ "$source" = "adzuna" ]; then
              ADZUNA_APP_ID="${{ secrets.ADZUNA_APP_ID }}" ADZUNA_APP_KEY="${{ secrets.ADZUNA_APP_KEY }}" python scripts/live_pipeline.py --live --source adzuna
            else
              python scripts/live_pipeline.py --live --source "$source"
            fi
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$source refresh failed (exit $status) -- see log above"
              failures=$((failures + 1))
            fi
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Retain first-party diagnostics outside the public Pages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-party-diagnostics-${{ github.run_id }}
          path: |
            jobs/runtime/raw/first-party-*.json
            jobs/runtime/sources/first-party-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish snapshot to the committed data path
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          mkdir -p ../data/jobs/raw
          cp runtime/jobs.json ../data/jobs/jobs.json
          cp runtime/jobs.ttl ../data/jobs/jobs.ttl
          cp runtime/run.json ../data/jobs/run.json
          rm -f ../data/jobs/raw/*.json
          for source in himalayas jobicy jooble arbeitnow adzuna; do
            [ -f "runtime/raw/$source.json" ] && cp "runtime/raw/$source.json" ../data/jobs/raw/
          done

      - name: Detect published snapshot changes
        id: changes
        # Stages data/jobs here, before the manifest step below, not just at
        # commit time: deployed_files() (which finalize-jobs/verify-jobs use
        # to enumerate data/jobs/) filters to git-tracked files whenever it
        # runs against a real checkout (see catalog_snapshot.py). A brand
        # new file -- e.g. data/jobs/raw/<source>.json the first time a
        # source ever runs -- would otherwise exist on disk but be silently
        # excluded from the manifest for being untracked, then get included
        # anyway once "Commit and push" staged it, producing a manifest that
        # never matches what was actually committed.
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          cd ..
          git add data/jobs
          if git diff --cached --quiet -- data/jobs/jobs.json data/jobs/jobs.ttl data/jobs/run.json data/jobs/raw; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate and verify the data/jobs/ manifest
        # Only regenerate when data/jobs/ actually changed this run: most
        # sources are gated by their own minRefreshIntervalSeconds and skip
        # most hourly runs, so sourceRetrievedAt (the newest known-good
        # per-source fetch time) can be well before this run started. The
        # manifest schema requires startedAt <= sourceRetrievedAt, which
        # only holds when this run itself is the one that produced the
        # freshest retrieval.
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd ..
          retrieved_at="$(python -c 'import json; print(max(json.load(open("data/jobs/run.json"))["sourceRefreshes"].values()))')"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/catalog_snapshot.py finalize-jobs --root . \
            --started-at "${{ steps.run_start.outputs.started_at }}" \
            --source-retrieved-at "$retrieved_at" \
            --completed-at "$completed_at"
          python scripts/catalog_snapshot.py verify-jobs --root .

      - name: Commit and push if the published snapshot changed
        id: commit
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          cd ..
          git add data/jobs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to the published kg-jobs snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh kg-jobs live snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report run outcome
        if: always()
        run: |
          {
            echo "## KG jobs live refresh"
            echo
            echo "- dryRun: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}"
            echo "- snapshotChanged: ${{ steps.commit.outputs.changed || 'skipped (dry run)' }}"
            echo "- sourcesWithHardFailures: ${{ steps.refresh.outputs.failures || 'unknown' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if any source hard-failed
        if: always()
        run: |
          if [ "${{ steps.refresh.outputs.failures }}" != "0" ]; then
            echo "One or more sources failed to refresh (not a refresh-interval skip); see logs above." >&2
            exit 1
          fi
