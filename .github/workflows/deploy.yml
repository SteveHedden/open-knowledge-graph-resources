name: Roll Back Catalog Generation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Immutable generation ID or Git ref to redeploy
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repository-publication
  cancel-in-progress: false
  queue: max

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository and generation tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require semantic-rollback credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Task 22 rollback requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node for exact-generation semantic rollback
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e mcp-server

      - name: Resolve immutable rollback target
        id: target
        run: >-
          python scripts/catalog_snapshot.py resolve-rollback
          --repository .
          --target "${{ inputs.target }}"
          --output-file "$GITHUB_OUTPUT"

      - name: Check out target in an isolated worktree
        run: git worktree add --detach "$RUNNER_TEMP/rollback-catalog" "${{ steps.target.outputs.commit }}"

      - name: Validate and verify exact rollback target
        run: |
          test "$(git -C "$RUNNER_TEMP/rollback-catalog" rev-parse HEAD)" = "${{ steps.target.outputs.commit }}"
          python -m pip install -r "$RUNNER_TEMP/rollback-catalog/requirements.txt"
          python "$RUNNER_TEMP/rollback-catalog/scripts/validate_catalog.py" \
            --root "$RUNNER_TEMP/rollback-catalog" \
            --repository-root "$RUNNER_TEMP/rollback-catalog" \
            --skip-baseline
          python "$RUNNER_TEMP/rollback-catalog/scripts/catalog_snapshot.py" verify \
            --root "$RUNNER_TEMP/rollback-catalog"

      - name: Restore latest verified kg-jobs snapshot into the rollback worktree
        run: |
          python scripts/catalog_snapshot.py verify-jobs --root .
          rm -rf "$RUNNER_TEMP/rollback-catalog/data/jobs"
          cp -R data/jobs "$RUNNER_TEMP/rollback-catalog/data/jobs"
          python "$RUNNER_TEMP/rollback-catalog/scripts/catalog_snapshot.py" verify-jobs \
            --root "$RUNNER_TEMP/rollback-catalog"

      - name: Ensure and verify target vector generation from exact rollback worktree
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OKG_DATA_DIR: ${{ runner.temp }}/rollback-catalog/data
        run: |
          npm --prefix api ci
          npm --prefix api run d1:migrate
          npm --prefix api run vectors:ensure
          npm --prefix api run vectors:verify

      - name: Deploy generation-aware API Worker for exact rollback data
        id: api_deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --prefix api run deploy

      - name: Build exact rollback Pages artifact
        run: |
          python "$RUNNER_TEMP/rollback-catalog/scripts/catalog_snapshot.py" build-pages \
            --root "$RUNNER_TEMP/rollback-catalog" \
            --destination "$RUNNER_TEMP/rollback-pages"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rollback Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: rollback-pages
          path: ${{ runner.temp }}/rollback-pages

      - name: Deploy rollback generation
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages

      - name: Verify rollback generation live
        id: smoke
        run: >-
          python "$RUNNER_TEMP/rollback-catalog/scripts/catalog_snapshot.py" smoke
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --generation-id "${{ steps.target.outputs.generation_id }}"

      - name: Verify rollback API, vector generation, and all local MCP search tools
        id: semantic
        run: >-
          python .github/workflows/scripts/verify_task22_surfaces.py
          --pages-base-url "${{ steps.deployment.outputs.page_url }}"
          --api-base-url "https://api.openknowledgegraphs.com"
          --generation-id "${{ steps.target.outputs.generation_id }}"

      - name: Advance moving pointers after verified rollback
        id: pointers
        run: >-
          python scripts/catalog_snapshot.py advance-rollback
          --repository .
          --target "${{ steps.target.outputs.commit }}"

      - name: Prune vector generations older than catalog-current and catalog-previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          retain_generations=()
          for tag in catalog-current catalog-previous; do
            if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
              generation_id="$(git show "${tag}:data/manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["generationId"])')"
              retain_generations+=("$generation_id")
            fi
          done
          RETAIN_GENERATIONS="$(IFS=,; echo "${retain_generations[*]}")" \
            npm --prefix api run vectors:prune

      - name: Report rollback outcome
        if: always()
        run: |
          deployment_attempted="${{ steps.deployment.outcome != 'skipped' }}"
          deployment_id="none"
          if [[ "$deployment_attempted" == "true" ]]; then
            deployment_id="manual-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          {
            echo "## Catalog rollback"
            echo
            echo "- repositoryChanged: false"
            echo "- repositoryCommit: $(git rev-parse HEAD)"
            echo "- rollbackTargetCommit: ${{ steps.target.outputs.commit || 'unresolved' }}"
            echo "- generationId: ${{ steps.target.outputs.generation_id || 'unresolved' }}"
            echo "- pagesDeploymentAttempted: $deployment_attempted"
            echo "- pagesDeploymentId: $deployment_id"
            echo "- pagesChanged: ${{ steps.deployment.outcome == 'success' }}"
            echo "- apiChanged: ${{ steps.api_deployment.outcome == 'success' }}"
            echo "- liveVerified: ${{ steps.semantic.outcome == 'success' }}"
            echo "- rollbackAttempted: true"
            echo "- rollbackSucceeded: ${{ steps.pointers.outcome == 'success' }}"
            echo "- repositoryAheadOfPages: ${{ steps.target.outputs.commit != github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
